server {
    listen 80;
    server_name lykhotaivan.site www.lykhotaivan.site localhost;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100m;

    # Docker DNS: позволяет найти новый IP Django после пересоздания.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $django_backend django-web:8000;

    # Django API, админка и вход в DRF.
    location ~ ^/(api|admin|api-auth)(/|$) {
        proxy_pass http://$django_backend$request_uri;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Собранная статика Django.
    location /static/ {
        alias /srv/static/;
    }

    # Публичные документы и изображения.
    location /media/ {
        alias /srv/media/;
    }

    # React, включая открытие вложенных страниц напрямую.
    location / {
        try_files $uri $uri/ /index.html;
    }
}